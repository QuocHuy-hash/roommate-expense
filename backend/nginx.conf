server {
    listen 80;
    server_name scapingapi.bigdealviet.com;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: increase body size for file uploads
    client_max_body_size 20M;

    # Optional: enable gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml text/javascript;
}
